<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>სწავლა - ლოკალური სასწავლო პლატფორმა</title>
    <meta name="description" content="სასწავლო მასალების ავტომატური დამუშავება: ჩანაწერები, ქვიზი, ცოდნის რუკა, ბარათები და წერითი ტესტი AI-ს გარეშე." />
    <meta property="og:title" content="სწავლა - ლოკალური სასწავლო პლატფორმა" />
    <meta property="og:description" content="სასწავლო მასალების ავტომატური დამუშავება: ჩანაწერები, ქვიზი, ცოდნის რუკა, ბარათები და წერითი ტესტი AI-ს გარეშე." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-indigo-950 dark:selection:text-indigo-200">
    <div id="root"></div>
    <noscript>ამ აპლიკაციის გამოსაყენებლად ჩართეთ JavaScript.</noscript>
    <script>
      // Fallback: never leave a blank white page if the app bundle fails to load or crashes before rendering.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center">' +
              '<div><h1 style="font-size:22px;font-weight:700;margin-bottom:12px">გვერდი ვერ ჩაიტვირთა</h1>' +
              '<p style="color:#475569;margin-bottom:20px">სცადეთ გვერდის განახლება.</p>' +
              '<button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:none;background:#4f46e5;color:#fff;cursor:pointer">განახლება</button></div></div>';
          }
        }, 4000);
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
